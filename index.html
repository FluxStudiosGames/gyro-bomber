<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Gyro Bomber</title>
<link rel="icon" href="data:,">
<style>
  html,body{margin:0;height:100%;background:#111;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{background:#000;image-rendering:auto;max-width:100%;max-height:100%}
  #touch{position:fixed;inset:0;pointer-events:none;display:none;z-index:5}
  .tb{position:absolute;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.28);color:rgba(255,255,255,.85);font:bold 16px sans-serif;display:flex;align-items:center;justify-content:center;pointer-events:auto;opacity:.75;-webkit-tap-highlight-color:transparent}
  #bU{left:50px;bottom:88px}#bD{left:50px;bottom:6px}#bL{left:6px;bottom:47px}#bR{left:94px;bottom:47px}
  #bB{right:10px;bottom:12px;width:58px;height:58px;background:rgba(255,80,40,.22);font-size:12px;border-radius:50%}
  #topBtns{position:fixed;top:8px;right:8px;z-index:20;display:flex;gap:6px;pointer-events:none}
  #topBtns button{pointer-events:auto;width:36px;height:36px;border-radius:8px;border:1.5px solid rgba(255,255,255,.35);background:rgba(0,0,0,.45);color:#fff;font:bold 16px sans-serif;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;opacity:.85}
  #topBtns button:active{opacity:1}
  #rotate{position:fixed;inset:0;z-index:50;background:rgba(10,10,20,.92);color:#fff;display:none;pointer-events:none;align-items:center;justify-content:center;flex-direction:column;font:bold 22px sans-serif;text-align:center;padding:24px}
  #rotate.show{display:flex;pointer-events:auto}
  #rotate small{display:block;margin-top:14px;font:16px sans-serif;color:#8fd3ff;font-weight:normal}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="960" height="540"></canvas></div>
<div id="touch">
  <div class="tb" id="bU">&#9650;</div><div class="tb" id="bD">&#9660;</div>
  <div class="tb" id="bL">&#9664;</div><div class="tb" id="bR">&#9654;</div>
  <div class="tb" id="bB">BOMB</div>
</div>
<div id="topBtns">
  <button type="button" id="bMute" title="Mute">♪</button>
  <button type="button" id="bFS" title="Fullscreen">⛶</button>
</div>
<div id="rotate">Rotate your phone<small>Gyro Bomber plays in landscape</small></div>
<script>
"use strict";
// ===== Gyro Bomber build 2 — single-file canvas game =====
const W = 960, H = 540;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
function fit(){ const s = Math.min(innerWidth / W, innerHeight / H); cv.style.width = (W*s)+'px'; cv.style.height = (H*s)+'px'; const tb = document.getElementById('topBtns'); if (tb) { tb.style.top = Math.round((innerHeight - H*s)/2 + 36*s + 6) + 'px'; tb.style.right = Math.round((innerWidth - W*s)/2 + 8) + 'px'; } updateRotate(); }
addEventListener('resize', fit); addEventListener('orientationchange', () => setTimeout(fit, 100));

// ---------- Config (tuning values; mirror these in Unity) ----------
const CFG = {
  lives: 3, maxFuel: 100, fuelDrain: 2.2, /* per second */ startBombs: 15, maxBombs: 25,
  playerSpeed: 260, baseScroll: 120, scrollPerLevel: 18, levelDistance: 2500,
  bombCooldown: 0.35, invulnTime: 2.0, gravity: 420, graceSec: 48
};

// ---------- Mute / fullscreen ----------
let muted = localStorage.getItem('gb_mute') === '1';
const bMute = document.getElementById('bMute');
function syncMute(){ bMute.textContent = muted ? '🔇' : '♪'; bMute.title = muted ? 'Unmute' : 'Mute'; }
syncMute();
function toggleMute(){ muted = !muted; try { localStorage.setItem('gb_mute', muted ? '1' : '0'); } catch(err){} syncMute(); audioInit(); }
bMute.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); toggleMute(); });
bMute.addEventListener('touchend', e => { e.preventDefault(); e.stopPropagation(); toggleMute(); });
const bFS = document.getElementById('bFS');
const isIPhone = /iPhone/i.test(navigator.userAgent || '');
const canFS = !isIPhone && !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
if (!canFS) bFS.style.display = 'none';
function toggleFS(){
  const d = document;
  if (d.fullscreenElement || d.webkitFullscreenElement) {
    (d.exitFullscreen || d.webkitExitFullscreen).call(d);
  } else {
    const el = document.documentElement;
    (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
  }
}
bFS.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); toggleFS(); });
bFS.addEventListener('touchend', e => { e.preventDefault(); e.stopPropagation(); try { toggleFS(); } catch(err){} });

// ---------- Portrait rotate overlay (touch only) ----------
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
const rotateEl = document.getElementById('rotate');
function updateRotate(){
  if (isTouch && innerHeight > innerWidth) {
    rotateEl.classList.add('show');
    rotateEl.style.display = 'flex';
    rotateEl.style.pointerEvents = 'auto';
  } else {
    rotateEl.classList.remove('show');
    rotateEl.style.display = 'none';
    rotateEl.style.pointerEvents = 'none';
  }
}
fit();

// ---------- Input ----------
const keys = {};
let bombPressed = false, anyPressed = false;
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
  if (!keys[k] && (k === ' ' || k === 'enter')) bombPressed = true;
  if (!keys[k]) anyPressed = true;
  keys[k] = true; audioInit();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
const touch = { u:0, d:0, l:0, r:0 };
if (isTouch) document.getElementById('touch').style.display = 'block';
// Multi-touch: track active pointer ids per button so move + BOMB can be held together
[['bU','u'],['bD','d'],['bL','l'],['bR','r'],['bB','b']].forEach(([id,k]) => {
  const el = document.getElementById(id);
  const active = new Set();
  const on = e => {
    e.preventDefault(); e.stopPropagation(); audioInit(); anyPressed = true;
    const pid = e.pointerId != null ? e.pointerId : 't';
    if (active.has(pid)) return;
    active.add(pid);
    try { el.setPointerCapture && el.setPointerCapture(pid); } catch(err){}
    if (k === 'b') bombPressed = true; else touch[k] = 1;
  };
  const off = e => {
    e.preventDefault();
    const pid = e.pointerId != null ? e.pointerId : 't';
    if (!active.has(pid) && e.type !== 'lostpointercapture') {
      // touchend fallback without pointerId match: clear if any
      if (e.changedTouches) { active.clear(); }
      else return;
    } else active.delete(pid);
    if (active.size === 0 && k !== 'b') touch[k] = 0;
  };
  el.addEventListener('pointerdown', on);
  el.addEventListener('pointerup', off);
  el.addEventListener('pointercancel', off);
  el.addEventListener('lostpointercapture', off);
  // touch fallback for older WebViews
  el.addEventListener('touchstart', on, {passive:false});
  el.addEventListener('touchend', off, {passive:false});
  el.addEventListener('touchcancel', off, {passive:false});
});
cv.addEventListener('pointerdown', () => { audioInit(); anyPressed = true; });
const inp = {
  up:    () => keys['arrowup'] || keys['w'] || touch.u,
  down:  () => keys['arrowdown'] || keys['s'] || touch.d,
  left:  () => keys['arrowleft'] || keys['a'] || touch.l,
  right: () => keys['arrowright'] || keys['d'] || touch.r
};

// ---------- Audio (WebAudio synth, no files) ----------
let ac = null;
function audioInit(){ if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} } else if (ac.state === 'suspended') ac.resume(); }
function tone(f1, f2, dur, type='square', vol=0.15){
  if (!ac || muted) return; const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(Math.max(20,f2), t+dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t+dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t+dur);
}
function noise(dur, vol=0.3){
  if (!ac || muted) return; const t = ac.currentTime, n = Math.floor(ac.sampleRate*dur), b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0);
  for (let i=0;i<n;i++) d[i] = (Math.random()*2-1) * (1 - i/n);
  const s = ac.createBufferSource(), g = ac.createGain(), f = ac.createBiquadFilter();
  f.type = 'lowpass'; f.frequency.value = 900; s.buffer = b; g.gain.value = vol;
  s.connect(f).connect(g).connect(ac.destination); s.start(t);
}
const SFX = {
  drop:   () => tone(900, 200, 0.35, 'sine', 0.12),
  boom:   () => { noise(0.6, 0.4); tone(120, 30, 0.5, 'sawtooth', 0.15); },
  shot:   () => tone(500, 300, 0.08, 'square', 0.05),
  hit:    () => { noise(0.4, 0.5); tone(300, 40, 0.6, 'sawtooth', 0.2); },
  pickup: () => { tone(500, 1000, 0.12, 'triangle', 0.15); setTimeout(()=>tone(700,1400,0.12,'triangle',0.15),90); },
  start:  () => { tone(300, 600, 0.15); setTimeout(()=>tone(600,900,0.2),150); },
  over:   () => { tone(400, 100, 0.9, 'sawtooth', 0.15); },
  level:  () => { tone(600, 1200, 0.25, 'triangle', 0.15); }
};

// ---------- Terrain (procedural height function of world x) ----------
const seedA = Math.random()*1000;
function groundY(wx){
  const x = wx + seedA;
  return 440 + Math.sin(x*0.004)*35 + Math.sin(x*0.011+1.3)*18 + Math.sin(x*0.027+2.1)*6;
}

// ---------- State ----------
let state = 'title'; // 'title' | 'play' | 'over'
let P, bombs, enemies, shots, parts, pickups, camX, score, best = +(localStorage.getItem('gb_best')||0), level, spawnX, msgT, msg, titleT = 0;
let playTime = 0, tipT = 0, tipText = '';
function grace(){ return Math.max(0, 1 - playTime / CFG.graceSec); } // 1→0 over first ~40s
function reset(){
  P = { x: 200, y: 160, vx: 0, vy: 0, lives: CFG.lives, fuel: CFG.maxFuel, bombs: CFG.startBombs, cd: 0, inv: CFG.invulnTime + 2.5, rot: 0 };
  bombs = []; enemies = []; shots = []; parts = []; pickups = [];
  camX = 0; score = 0; level = 1; spawnX = W + 550; msg = 'LEVEL 1'; msgT = 2;
  playTime = 0;
  tipText = ''; tipT = 0;
}
reset();

// Enemy types: tank (moves, fires aimed shots), bunker (static, fires bursts), aa (flak gun, fast shots), depot (fuel/ammo, harmless)
const ETYPES = {
  tank:   { w: 44, h: 20, hp: 1, pts: 100, fire: 2.6 },
  bunker: { w: 50, h: 26, hp: 2, pts: 150, fire: 3.2 },
  aa:     { w: 30, h: 22, hp: 1, pts: 200, fire: 1.6 },
  depot:  { w: 40, h: 30, hp: 1, pts: 50,  fire: 0 }
};
function spawnEnemies(){
  const g = grace();
  while (spawnX < camX + W + 300) {
    const gapMul = 1 + g * 1.8; // wider gaps early
    spawnX += (170 + Math.random()*220 - Math.min(level*10, 80)) * gapMul;
    const r = Math.random();
    let t = r < 0.38 ? 'tank' : r < 0.62 ? 'bunker' : r < 0.82 ? 'aa' : 'depot';
    // first ~40s: almost no AA, fewer bunkers, more depots/tanks
    if (g > 0.15) {
      if (t === 'aa') t = Math.random() < 0.7 ? 'tank' : 'depot';
      else if (t === 'bunker' && Math.random() < g) t = 'tank';
      if (Math.random() < g * 0.25) t = 'depot';
    } else if (level === 1 && t === 'aa' && Math.random() < 0.5) t = 'tank';
    const d = ETYPES[t];
    const fireDelay = (d.fire ? (3.5 + Math.random()*d.fire + g*5) : 0); // much later first shot early
    enemies.push({ t, x: spawnX, w: d.w, h: d.h, hp: d.hp, fireT: fireDelay, vx: t==='tank' ? -(20+Math.random()*30)*(1 - g*0.5) : 0, flash: 0 });
  }
}

function boom(x, y, n=18, col='#fa3'){
  for (let i=0;i<n;i++){ const a = Math.random()*Math.PI*2, s = 40+Math.random()*200;
    parts.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s - 60, life: 0.5+Math.random()*0.6, col: Math.random()<0.5?col:'#ff6', r: 2+Math.random()*3 }); }
}
function hurtPlayer(){
  if (P.inv > 0) return;
  P.lives--; SFX.hit(); boom(P.x, P.y, 30, '#f44');
  if (P.lives <= 0) { gameOver(); return; }
  P.inv = CFG.invulnTime; P.y = 160; P.fuel = Math.max(P.fuel, 50);
}
function gameOver(){
  state = 'over'; SFX.over(); titleT = 0;
  if (score > best) { best = score; try { localStorage.setItem('gb_best', best); } catch(e){} }
}

// ---------- Update ----------
function update(dt){
  titleT += dt;
  if (state !== 'play') {
    if ((anyPressed || bombPressed) && titleT > 0.6) {
      reset(); state = 'play'; SFX.start();
      try {
        if (!localStorage.getItem('gb_tip')) {
          tipText = 'Drop bombs early: they fly forward!'; tipT = 5;
          localStorage.setItem('gb_tip', '1');
        }
      } catch(e){ tipText = 'Drop bombs early: they fly forward!'; tipT = 5; }
    }
    anyPressed = bombPressed = false; return;
  }
  playTime += dt;
  if (tipT > 0) tipT -= dt;
  const g = grace();
  const scroll = CFG.baseScroll + (level-1)*CFG.scrollPerLevel;
  camX += scroll*dt;
  const newLevel = 1 + Math.floor(camX / CFG.levelDistance);
  if (newLevel > level) { level = newLevel; msg = 'LEVEL ' + level; msgT = 2; SFX.level(); }

  // player
  const ix = (inp.right()?1:0) - (inp.left()?1:0), iy = (inp.down()?1:0) - (inp.up()?1:0);
  P.vx += (ix*CFG.playerSpeed - P.vx) * Math.min(1, dt*6);
  P.vy += (iy*CFG.playerSpeed - P.vy) * Math.min(1, dt*6);
  P.x = Math.max(30, Math.min(W*0.7, P.x + P.vx*dt));
  P.y = Math.max(40, P.y + P.vy*dt);
  P.rot += dt*30; P.inv = Math.max(0, P.inv - dt); P.cd -= dt;
  P.fuel -= CFG.fuelDrain*dt*(1 + (level-1)*0.05);
  if (P.fuel <= 0) { P.fuel = 0; P.y += 60*dt; } // out of fuel: sink
  if (P.y + 10 > groundY(camX + P.x)) { P.inv = 0; hurtPlayer(); if (state !== 'play') return; P.fuel = Math.max(P.fuel, 50); }
  if (bombPressed && P.cd <= 0 && P.bombs > 0) {
    bombs.push({ x: P.x, y: P.y + 12, vx: P.vx*0.5 + scroll, vy: 40 }); P.bombs--; P.cd = CFG.bombCooldown; SFX.drop();
  }
  bombPressed = false; anyPressed = false;

  // bombs (stored in world coords)
  for (const b of bombs) {
    if (b.wx === undefined) { b.wx = b.x + camX; }
    b.vy += CFG.gravity*dt; b.wx += b.vx*dt*0.5; b.y += b.vy*dt;
    let hit = false;
    for (const e of enemies) {
      if (e.hp > 0 && Math.abs(b.wx - e.x) < e.w/2 + 6 && b.y > groundY(e.x) - e.h - 4) {
        e.hp--; e.flash = 0.15; hit = true;
        if (e.hp <= 0) {
          score += ETYPES[e.t].pts * level; boom(e.x - camX, groundY(e.x) - e.h/2, 26); SFX.boom();
          if (e.t === 'depot') { pickups.push({ x: e.x, y: groundY(e.x) - 40, vy: -120, t: 0 }); }
        } else { SFX.shot(); boom(e.x - camX, groundY(e.x) - e.h, 8, '#ccc'); }
        break;
      }
    }
    if (!hit && b.y > groundY(b.wx)) { hit = true; boom(b.wx - camX, b.y, 10, '#a86'); SFX.boom(); }
    if (hit) b.dead = true;
  }
  bombs = bombs.filter(b => !b.dead);

  // enemies
  for (const e of enemies) {
    e.x += e.vx*dt; e.flash -= dt;
    const sx = e.x - camX;
    if (e.hp > 0 && ETYPES[e.t].fire && sx > 0 && sx < W) {
      // early game: fire much slower
      e.fireT -= dt * (1 + (level-1)*0.15) * (1 - g * 0.92);
      if (e.fireT <= 0) {
        e.fireT = ETYPES[e.t].fire * (0.7 + Math.random()*0.6) * (1 + g * 1.5);
        const gx = sx, gy = groundY(e.x) - e.h;
        const spd = ((e.t === 'aa' ? 300 : 200) + level*12) * (1 - g * 0.45);
        let dx = P.x - gx, dy = P.y - gy;
        if (e.t === 'bunker') { dx += (Math.random()-0.5)*160; }
        // early: add aim wobble so idle player isn't lasered
        if (g > 0) { dx += (Math.random()-0.5)*120*g; dy += (Math.random()-0.5)*40*g; }
        const len = Math.hypot(dx, dy) || 1;
        if (dy < 0) { shots.push({ x: gx, y: gy, vx: dx/len*spd, vy: dy/len*spd, life: 4 }); SFX.shot(); }
      }
    }
  }
  enemies = enemies.filter(e => e.x - camX > -100 && (e.hp > 0 || false));
  spawnEnemies();

  // enemy shots
  for (const s of shots) {
    s.x += s.vx*dt; s.y += s.vy*dt; s.life -= dt;
    if (Math.hypot(s.x - P.x, s.y - P.y) < 16) { s.life = 0; hurtPlayer(); if (state !== 'play') return; }
  }
  shots = shots.filter(s => s.life > 0 && s.y > -20 && s.x > -20 && s.x < W+20);

  // pickups (from depots): float up then hang; collect for fuel + bombs
  for (const p of pickups) {
    p.t += dt; p.vy = Math.min(p.vy + 150*dt, 0); p.y += p.vy*dt;
    if (Math.hypot(p.x - camX - P.x, p.y - P.y) < 30) {
      p.dead = true; P.fuel = CFG.maxFuel; P.bombs = Math.min(CFG.maxBombs, P.bombs + 8); score += 50; SFX.pickup();
      msg = 'FUEL + BOMBS'; msgT = 1;
    }
    if (p.x - camX < -40 || p.t > 12) p.dead = true;
  }
  pickups = pickups.filter(p => !p.dead);
  // emergency resupply so the run can't soft-lock with 0 bombs
  if (P.bombs === 0 && pickups.length === 0 && !enemies.some(e => e.t === 'depot' && e.x > camX)) {
    pickups.push({ x: camX + W + 40, y: 120 + Math.random()*150, vy: 0, t: 0 }); // airdropped crate
  }

  for (const p of parts) { p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 300*dt; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);
  msgT -= dt;
}

// ---------- Draw ----------
function drawSky(){
  const g = ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#1b2a5a'); g.addColorStop(0.6,'#e08a5a'); g.addColorStop(1,'#f3c07a');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  // parallax hills
  ctx.fillStyle = '#6b4a6e'; ctx.beginPath(); ctx.moveTo(0,H);
  for (let x=0;x<=W;x+=20) ctx.lineTo(x, 330 + Math.sin((x + camX*0.3)*0.006)*40);
  ctx.lineTo(W,H); ctx.fill();
  // clouds
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  for (let i=0;i<6;i++){ const x = ((i*230 - camX*0.15) % (W+200) + W+200) % (W+200) - 100, y = 60 + (i*53)%120;
    ctx.beginPath(); ctx.ellipse(x, y, 60, 16, 0, 0, Math.PI*2); ctx.ellipse(x+30, y-8, 40, 14, 0, 0, Math.PI*2); ctx.fill(); }
}
function drawGround(){
  ctx.fillStyle = '#4a7a2e'; ctx.beginPath(); ctx.moveTo(0,H);
  for (let x=0;x<=W;x+=8) ctx.lineTo(x, groundY(camX + x));
  ctx.lineTo(W,H); ctx.fill();
  ctx.strokeStyle = '#7cb342'; ctx.lineWidth = 3; ctx.beginPath();
  for (let x=0;x<=W;x+=8) ctx.lineTo(x, groundY(camX + x)); ctx.stroke();
}
function drawEnemy(e){
  const sx = e.x - camX, gy = groundY(e.x);
  ctx.save(); ctx.translate(sx, gy);
  const fl = e.flash > 0;
  if (e.t === 'tank') {
    ctx.fillStyle = fl?'#fff':'#556b2f'; ctx.fillRect(-22,-14,44,12);
    ctx.fillStyle = fl?'#fff':'#3d4f22'; ctx.fillRect(-12,-22,22,9);
    ctx.strokeStyle = '#3d4f22'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(-2,-18);
    const a = Math.atan2(P.y - (gy-18), P.x - sx); ctx.lineTo(-2+Math.cos(a)*20, -18+Math.sin(a)*20); ctx.stroke();
    ctx.fillStyle = '#222'; for (let i=-18;i<=18;i+=9){ ctx.beginPath(); ctx.arc(i,-3,4,0,Math.PI*2); ctx.fill(); }
  } else if (e.t === 'bunker') {
    ctx.fillStyle = fl?'#fff':'#8d8d8d'; ctx.beginPath(); ctx.moveTo(-25,0); ctx.lineTo(-18,-26); ctx.lineTo(18,-26); ctx.lineTo(25,0); ctx.fill();
    ctx.fillStyle = '#222'; ctx.fillRect(-12,-18,24,5);
    if (e.hp < 2) { ctx.strokeStyle = '#333'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-10,-26); ctx.lineTo(-3,-12); ctx.lineTo(6,-20); ctx.stroke(); }
  } else if (e.t === 'aa') {
    ctx.fillStyle = fl?'#fff':'#7a2e2e'; ctx.fillRect(-15,-10,30,10);
    ctx.strokeStyle = '#aaa'; ctx.lineWidth = 3; const a = Math.atan2(P.y-(gy-12), P.x-sx);
    for (const o of [-4,4]) { ctx.beginPath(); ctx.moveTo(o,-10); ctx.lineTo(o+Math.cos(a)*22, -10+Math.sin(a)*22); ctx.stroke(); }
  } else if (e.t === 'depot') {
    ctx.fillStyle = fl?'#fff':'#c9a227'; ctx.beginPath(); ctx.ellipse(0,-15,20,15,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#7a5a00'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('FUEL', 0, -11);
  }
  ctx.restore();
}
function drawPlayer(){
  if (P.inv > 0 && Math.floor(P.inv*10)%2 === 0) return;
  ctx.save(); ctx.translate(P.x, P.y); ctx.rotate(P.vx/1500);
  // body
  ctx.fillStyle = '#f2c230'; ctx.beginPath(); ctx.ellipse(0,0,18,10,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#8fd3ff'; ctx.beginPath(); ctx.ellipse(7,-3,7,5,0,0,Math.PI*2); ctx.fill();
  // tail
  ctx.strokeStyle = '#c99a10'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(-16,0); ctx.lineTo(-34,-4); ctx.stroke();
  ctx.fillStyle = '#c99a10'; ctx.fillRect(-38,-12,5,14);
  // rear pusher prop
  ctx.strokeStyle = '#ddd'; ctx.lineWidth = 2; const pr = Math.sin(P.rot*2)*10;
  ctx.beginPath(); ctx.moveTo(-20,-pr); ctx.lineTo(-20,pr); ctx.stroke();
  // mast + rotor
  ctx.strokeStyle = '#555'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0,-9); ctx.lineTo(0,-18); ctx.stroke();
  const rl = Math.abs(Math.cos(P.rot))*30 + 4;
  ctx.strokeStyle = '#333'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-rl,-19); ctx.lineTo(rl,-19); ctx.stroke();
  // skids
  ctx.strokeStyle = '#444'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-10,10); ctx.lineTo(12,10); ctx.stroke();
  ctx.restore();
}
function hud(){
  ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(0,0,W,36);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 18px monospace'; ctx.textAlign = 'left';
  ctx.fillText('SCORE ' + score, 12, 24);
  ctx.fillText('LV ' + level, 200, 24);
  ctx.fillText('BOMBS ' + P.bombs, 290, 24);
  ctx.fillText('FUEL', 440, 24);
  ctx.fillStyle = '#333'; ctx.fillRect(490, 10, 160, 16);
  ctx.fillStyle = P.fuel < 25 ? '#f44' : '#4caf50'; ctx.fillRect(490, 10, 160*P.fuel/CFG.maxFuel, 16);
  ctx.fillStyle = '#fff'; ctx.fillText('LIVES', 680, 24);
  for (let i=0;i<P.lives;i++){ ctx.fillStyle = '#f2c230'; ctx.beginPath(); ctx.ellipse(755+i*26, 18, 9, 6, 0, 0, Math.PI*2); ctx.fill(); }
  ctx.textAlign = 'right'; ctx.fillStyle = '#ccc'; ctx.fillText('HI ' + best, W-12, 24);
  if (msgT > 0) { ctx.textAlign = 'center'; ctx.font = 'bold 36px monospace'; ctx.fillStyle = '#fff'; ctx.fillText(msg, W/2, 130); }
  if (tipT > 0 && tipText) {
    const a = tipT < 1 ? tipT : 1;
    ctx.globalAlpha = a;
    ctx.textAlign = 'center'; ctx.font = 'bold 22px monospace'; ctx.fillStyle = '#ffeb3b';
    ctx.fillText(tipText, W/2, 200);
    ctx.globalAlpha = 1;
  }
  if (P.fuel < 25 && Math.floor(titleT*4)%2) { ctx.textAlign='center'; ctx.font='bold 22px monospace'; ctx.fillStyle='#f44'; ctx.fillText('LOW FUEL - BOMB A FUEL DEPOT!', W/2, 170); }
}
function centerText(lines){
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0,0,W,H); ctx.textAlign = 'center';
  for (const [t, y, sz, col] of lines) { ctx.font = 'bold '+sz+'px monospace'; ctx.fillStyle = col; ctx.fillText(t, W/2, y); }
}
function draw(){
  drawSky(); drawGround();
  for (const e of enemies) drawEnemy(e);
  for (const p of pickups) { const x = p.x - camX; ctx.fillStyle = '#ffeb3b'; ctx.fillRect(x-12, p.y-10, 24, 20); ctx.fillStyle='#000'; ctx.font='bold 12px sans-serif'; ctx.textAlign='center'; ctx.fillText('F+B', x, p.y+4);
    ctx.strokeStyle='#fff'; ctx.beginPath(); ctx.moveTo(x-12,p.y-10); ctx.lineTo(x,p.y-28); ctx.lineTo(x+12,p.y-10); ctx.stroke(); }
  ctx.fillStyle = '#222'; for (const b of bombs) { ctx.beginPath(); ctx.ellipse(b.wx - camX, b.y, 4, 7, 0, 0, Math.PI*2); ctx.fill(); }
  ctx.fillStyle = '#ff5252'; for (const s of shots) { ctx.beginPath(); ctx.arc(s.x, s.y, 4, 0, Math.PI*2); ctx.fill(); }
  for (const p of parts) { ctx.globalAlpha = Math.max(0, Math.min(1, p.life*2)); ctx.fillStyle = p.col; ctx.fillRect(p.x-p.r, p.y-p.r, p.r*2, p.r*2); }
  ctx.globalAlpha = 1;
  if (state === 'play' || state === 'over') drawPlayer();
  if (state === 'play') hud();
  if (state === 'title') {
    camX += 1; P.x = 300 + Math.sin(titleT)*60; P.y = 220 + Math.sin(titleT*1.7)*20; P.rot += 0.5; P.inv = 0; drawPlayer();
    centerText([['GYRO BOMBER', 150, 64, '#f2c230'],
      ['Bomb tanks, bunkers & flak guns. Dodge the anti-air fire!', 300, 18, '#fff'],
      ['Bomb FUEL depots, then grab the crate for fuel + bombs.', 328, 18, '#fff'],
      [isTouch ? 'D-pad: fly   BOMB: drop bomb' : 'Arrows / WASD: fly    Space: drop bomb', 380, 20, '#8fd3ff'],
      [Math.floor(titleT*2)%2 ? (isTouch ? 'TAP TO START' : 'PRESS ANY KEY TO START') : '', 450, 26, '#fff'],
      ['HI ' + best, 500, 16, '#ccc']]);
  }
  if (state === 'over') {
    hud();
    centerText([['GAME OVER', 200, 64, '#ff5252'], ['SCORE ' + score + '   LEVEL ' + level, 270, 26, '#fff'],
      ['BEST ' + best, 310, 20, '#ccc'], [titleT > 0.6 ? (isTouch ? 'TAP TO RESTART' : 'PRESS ANY KEY TO RESTART') : '', 400, 24, '#8fd3ff']]);
  }
}

// ---------- Loop ----------
let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now - last)/1000); last = now;
  update(dt); draw(); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
// Debug/test hook (used by automated test only)
window.__gb = { get state(){ return state; }, get score(){ return score; }, get playTime(){ return playTime; }, get lives(){ return P && P.lives; }, kill(){ P.inv = 0; P.lives = 1; hurtPlayer(); }, start(){ if (state!=='play'){ reset(); state='play'; SFX.start(); try{ if(!localStorage.getItem('gb_tip')){ tipText='Drop bombs early: they fly forward!'; tipT=5; localStorage.setItem('gb_tip','1'); } }catch(e){ tipText='Drop bombs early: they fly forward!'; tipT=5; } } } };
</script>
</body>
